name: "🔄 应用更新兼容与异常 / App Update Compatibility"
description: "申请兼容外盘应用自更新，或反馈显示「可用」却无法更新的问题 / Request external update support or report a broken Available app update"
title: "[UPDATE] "
labels: ["app-update"]
body:
  - type: markdown
    attributes:
      value: |
        中文或英文填写均可，无需双语填写；请每次只针对**一款应用**提交反馈，提交前先搜索已有 Issue。

        Chinese or English is welcome; you do not need to write both. Please submit one app per issue and search existing issues first.

        标题建议格式：`[UPDATE] 应用名 - 申请兼容` 或 `[UPDATE] 应用名 - 更新失败`。

        Suggested title format: `[UPDATE] App Name - Request support` or `[UPDATE] App Name - Update failed`.

  - type: dropdown
    id: feedback_type
    attributes:
      label: "反馈类型 / Feedback type"
      options:
        - "申请兼容：希望 AppPorts 支持这款应用的外盘自更新 / Request support: support external self-update for this app"
        - "更新异常：AppPorts 显示「更新：可用」，但实际无法更新 / Update broken: marked as Available, but failed to update"
        - "其他外盘更新问题 / Other external app update issue"
    validations:
      required: true

  - type: input
    id: target_app
    attributes:
      label: "目标应用名称与当前版本 / Target app name & current version"
      description: |
        填写应用名称和当前版本号；若知道更新后的目标版本也可一并注明。

        Enter the app name and current version; include the target version if known.
      placeholder: "例如：Cursor 1.2.3（或 IINA 1.3.5 → 1.5.1） / e.g. Cursor 1.2.3 (or IINA 1.3.5 → 1.5.1)"
    validations:
      required: true

  - type: input
    id: app_source_and_id
    attributes:
      label: "应用下载来源与 Bundle ID（选填） / Download source & Bundle ID (optional)"
      description: |
        例如官网下载、Homebrew、Mac App Store、GitHub Release；知道 Bundle ID 可一并填写，不清楚可留空。

        e.g. official website, Homebrew, Mac App Store, GitHub Release; add Bundle ID if known.
      placeholder: "例如：官网下载，com.example.app / e.g. Official website, com.example.app"
    validations:
      required: false

  - type: dropdown
    id: update_status_and_guardian
    attributes:
      label: "AppPorts 当前显示的更新状态与守护设置 / Update badge & guardian status in AppPorts"
      description: |
        请对照 AppPorts 应用列表中的胶囊徽章，以及“设置 → 后台代理 → 应用更新守护”开关状态选择。

        Match the badge shown in AppPorts and the App Update Guardian toggle in Settings → Background Agents.
      options:
        - "显示「更新：可用」，且已开启“应用更新守护” / Shows Available, Guardian enabled"
        - "显示「更新：可用」，未开启“应用更新守护” / Shows Available, Guardian disabled"
        - "显示「更新：未知」或仅支持「锁定迁移」 / Shows Unknown or Locked Migration only"
        - "显示「更新：检测中」 / Shows Checking"
        - "显示「待迁出」 / Shows Pending Move Out"
        - "Mac App Store 应用（显示「商店」） / Mac App Store app (Store badge)"
        - "不清楚 / Not sure"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: "具体情况与现象描述 / Details & actual behavior"
      description: |
        申请兼容时，请说明这款应用平时如何更新（应用内检查更新、自动静默更新、`brew upgrade` 等），以及迁到外盘后点击更新发生了什么。更新失败时，请说明是否从本机原入口启动、点击更新后的完整表现（如新版装回本机、重启仍是旧版、提示签名异常、任务中心显示恢复失败或回退等）。

        For compatibility requests, describe how the app normally updates and what happens after moving it to an external drive. For broken updates, note whether you launched from the local portal, what happened after updating, and any error or Task Center result.
      placeholder: |
        应用的常规更新方式（应用内更新 / 自动更新 / Homebrew / 其他） / How the app normally updates:
        迁到外盘后实际发生的情况或完整错误提示 / Actual outcome or exact error after moving to external storage:
        是否通过本机原入口（“应用程序”或 Dock 原图标）启动 / Launched from local portal (Applications or original Dock icon):
    validations:
      required: true

  - type: dropdown
    id: app_version
    attributes:
      label: "AppPorts 版本 / AppPorts version"
      description: |
        在“关于 AppPorts”查看；其他版本可在下方补充。

        Check About AppPorts; add unlisted versions below.
      options:
        - "2.4.1"
        - "2.4.0"
        - "2.3.0"
        - "2.2.0"
        - "2.1.0"
        - "2.0.0"
        - "1.9.3 或更早 / 1.9.3 or earlier"
        - "其他版本或自行编译 / Other version or self-built"
        - "不清楚 / Not sure"
    validations:
      required: true

  - type: dropdown
    id: os_version
    attributes:
      label: "macOS 版本 / macOS version"
      description: |
        苹果菜单 → 关于本机；小版本可在下方补充。

        Apple menu → About This Mac; add the minor version below if relevant.
      options:
        - "macOS 27"
        - "macOS 26"
        - "macOS 15"
        - "macOS 14"
        - "macOS 13"
        - "macOS 12"
        - "其他版本 / Other version"
        - "不清楚 / Not sure"
    validations:
      required: true

  - type: dropdown
    id: filesystem
    attributes:
      label: "目标存储的文件系统（选填） / Destination filesystem (optional)"
      description: |
        可在“磁盘工具”或 Finder 的“显示简介”查看。

        Check Disk Utility or Finder’s Get Info.
      options:
        - "APFS"
        - "Mac OS 扩展（HFS+） / Mac OS Extended (HFS+)"
        - "exFAT"
        - "FAT32 / MS-DOS (FAT)"
        - "SMB / NFS 等网络共享 / Network share"
        - "其他 / Other"
        - "不清楚 / Not sure"
    validations:
      required: false

  - type: input
    id: environment_details
    attributes:
      label: "环境补充（选填） / Additional environment details (optional)"
      description: |
        可补充 macOS 小版本、AppPorts Build 号、Mac 芯片（Apple Silicon / Intel）或未列出的版本信息。

        Optional minor OS version, AppPorts build number, Mac chip, or unlisted versions.
      placeholder: "例如 macOS 15.7.7；AppPorts Build 103；Apple Silicon / e.g. macOS 15.7.7; Build 103; Apple Silicon"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "截图（选填） / Screenshots (optional)"
      description: |
        可拖入 AppPorts 徽章截图、应用更新报错截图或任务中心记录截图；上传前请检查姓名、路径等个人信息。

        Drag in screenshots of AppPorts badges, update errors, or Task Center records; check personal details first.
    validations:
      required: false

  - type: textarea
    id: diagnostic_package
    attributes:
      label: "诊断日志包（强烈推荐） / Diagnostic log package (strongly recommended)"
      description: |
        **强烈推荐提交诊断日志包**，这能极大帮助定位外盘更新机制、应用更新守护（ShipIt）接手记录与签名校验状态。导出路径：点击 AppPorts 窗口左下角设置图标（⚙️）→「日志设置」→「导出诊断包」，将生成的 `.zip` 文件拖入下方（上传前请留意检查个人路径或账号信息）。如果不方便公开上传，也可以发送至 **a@shimoko.com**，并在邮件标题或正文中做好备注（注明本 Issue 链接/编号、受影响的应用名称与大致发生时间）。

        **Attaching a diagnostic log package is strongly recommended** to inspect the update mechanism, Guardian (ShipIt) logs, and signature status. Export via the Settings icon (⚙️) in the bottom-left corner of AppPorts → Log Settings → Export Diagnostics Package, then drop the `.zip` file below (check personal paths or account details before uploading). Alternatively, email it to **a@shimoko.com** with a clear note (include the Issue link/number, app name, and approximate time).
    validations:
      required: false
