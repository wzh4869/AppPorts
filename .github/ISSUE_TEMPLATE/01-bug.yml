name: "🐛 问题反馈 / Bug Report"
description: "报告使用中遇到的问题 / Report a problem using AppPorts"
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        正文不限语言，无需双语；不确定的环境信息可选“不清楚”。**建议标题使用英文或中文**简述现象（例如：`Moving an app back reports an existing destination`）。

        Any language is welcome in the body (no need for both); choose “Not sure” when needed. An **English or Chinese title** summarizing the symptom is recommended (e.g. `Moving an app back reports an existing destination`).

  - type: textarea
    id: problem
    attributes:
      label: "问题描述 / Problem"
      description: |
        说明你想完成的操作、预期结果与实际表现。<br>
        Describe what you tried, the expected result, and the actual outcome.
      placeholder: |
        我想进行的操作：
        预期结果：
        实际结果或完整错误提示：

        What I tried / Expected result / Actual error:
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "复现步骤（选填） / Steps to reproduce (optional)"
      description: |
        偶发或记不清步骤也可反馈，请尽量说明最后一次操作。<br>
        Intermittent issues are welcome; describe the last action if exact steps are unknown.
      placeholder: |
        1. 从哪个页面开始
        2. 选择了什么、点击了什么
        3. 出现了什么提示

        1. Page opened / 2. Action clicked / 3. Error shown
    validations:
      required: false

  - type: dropdown
    id: operation
    attributes:
      label: "发生问题的操作 / Affected operation"
      options:
        - "应用迁出或迁回 / Move an app out or back"
        - "应用链接、启动或更新 / App linking, launching or updating"
        - "容器数据挂载迁移或还原 / Container mount migration or restore"
        - "微信账号全部或拆分迁移 / Whole or split WeChat account migration"
        - "工具目录或自选文件夹迁移 / Tool or custom-folder migration"
        - "接回、挂载或解锁数据卷 / Reconnect, mount or unlock data"
        - "弹出外置盘 / Eject an external disk"
        - "签名检查、重签或修复 / Signature check, re-signing or repair"
        - "扫描、界面、设置或其他 / Scanning, interface, settings or other"
        - "不清楚 / Not sure"
    validations:
      required: true

  - type: dropdown
    id: app_version
    attributes:
      label: "AppPorts 版本 / AppPorts version"
      description: |
        在“关于 AppPorts”查看，其他版本可在下方补充。<br>
        Check About AppPorts; add unlisted versions below.
      options:
        - "2.4.1"
        - "2.4.0"
        - "2.3.0"
        - "2.2.0"
        - "2.1.0"
        - "2.0.0"
        - "1.9.3"
        - "1.9.2"
        - "1.9.1"
        - "1.9.0"
        - "1.8.x 或更早 / 1.8.x or earlier"
        - "其他版本或自行编译 / Other version or self-built"
        - "不清楚 / Not sure"
    validations:
      required: true

  - type: input
    id: app_build
    attributes:
      label: "Build 号（选填） / Build number (optional)"
      description: |
        “关于 AppPorts”中版本后的括号数字，找不到可留空。<br>
        Number in parentheses after the version in About AppPorts.
      placeholder: "例如：103 / e.g. 103"
    validations:
      required: false

  - type: dropdown
    id: os_version
    attributes:
      label: "macOS 版本 / macOS version"
      description: |
        苹果菜单 → 关于本机；小版本可在下方补充。<br>
        Apple menu → About This Mac; add minor version below if relevant.
      options:
        - "macOS 27"
        - "macOS 26"
        - "macOS 15"
        - "macOS 14"
        - "macOS 13"
        - "macOS 12"
        - "其他版本 / Other version"
        - "不清楚 / Not sure"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: "Mac 芯片 / Mac processor"
      options:
        - "Apple Silicon（M 系列 / M-series）"
        - "Intel"
        - "不清楚 / Not sure"
    validations:
      required: false

  - type: dropdown
    id: external_storage_type
    attributes:
      label: "外置存储类型 / External storage type"
      description: |
        选择与本次问题相关的存储，无需填写品牌型号。<br>
        Choose the storage involved; no brand or model needed.
      options:
        - "外置 SSD / External SSD"
        - "外置机械硬盘 / External HDD"
        - "硬盘盒（不确定内部硬盘类型） / Enclosure (drive type unknown)"
        - "U 盘或存储卡 / USB flash drive or memory card"
        - "NAS 或网络存储 / NAS or network storage"
        - "磁盘映像 / Disk image"
        - "其他 / Other"
        - "未使用外置存储 / No external storage involved"
        - "不清楚 / Not sure"
    validations:
      required: false

  - type: dropdown
    id: filesystem
    attributes:
      label: "目标文件系统 / Destination filesystem"
      description: |
        可在“磁盘工具”或 Finder“显示简介”查看。<br>
        Check Disk Utility or Finder’s Get Info.
      options:
        - "APFS"
        - "Mac OS 扩展（HFS+） / Mac OS Extended (HFS+)"
        - "exFAT"
        - "FAT32 / MS-DOS (FAT)"
        - "SMB / NFS 等网络共享 / Network share"
        - "其他 / Other"
        - "不适用 / Not applicable"
        - "不清楚 / Not sure"
    validations:
      required: false

  - type: dropdown
    id: encryption
    attributes:
      label: "卷加密状态 / Volume encryption"
      description: |
        若外盘与 AppPorts 数据卷加密状态不同，可在下方补充。<br>
        If the drive and AppPorts data volume differ, explain below.
      options:
        - "已加密 / Encrypted"
        - "未加密 / Not encrypted"
        - "不适用 / Not applicable"
        - "不清楚 / Not sure"
    validations:
      required: false

  - type: input
    id: environment_details
    attributes:
      label: "环境补充（选填） / Environment details (optional)"
      description: |
        仅在选项不足时补充系统小版本、未列出的版本或受影响应用。<br>
        Optional minor OS version, unlisted AppPorts version, or affected app.
      placeholder: "例如：macOS 27.0.1；受影响应用及版本 / e.g. macOS 27.0.1; affected app"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "截图（选填） / Screenshots (optional)"
      description: |
        可拖入完整错误提示或相关页面截图，上传前请检查个人隐私信息。<br>
        Drag in screenshots of errors or relevant pages; check personal details first.
    validations:
      required: false

  - type: textarea
    id: diagnostic_package
    attributes:
      label: "诊断日志包（强烈推荐） / Diagnostic logs (strongly recommended)"
      description: |
        **强烈推荐提交诊断日志包**，能大幅加快问题定位：<br>
        点击 AppPorts 窗口左下角设置图标（⚙️）→「日志设置」→「导出诊断包」，将 `.zip` 拖入下方；若不方便公开上传，可发送至 **a@shimoko.com** 并注明 Issue 链接或编号。<br>
        **Strongly recommended** — click the Settings icon (⚙️) in the bottom-left → Log Settings → Export Diagnostics Package, and drop the `.zip` below (or email **a@shimoko.com** with the Issue link/number).
    validations:
      required: false
